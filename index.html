<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon_transparent.png" />
    <link rel="apple-touch-icon" href="/favicon_transparent.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <title>بر للتمريض المنزلي ورعايه المسنين بالمنزل</title>
    <meta name="description" content="بر للتمريض المنزلي هو مركز متخصص في مجال الرعاية الصحية والطبية المنزلية، حيث يقدم أفضل خدمات التمريض المنزلي ورعاية كبار السن بالمنزل. نقدم خدمات الرعاية المنزلية المحترفة والمخصصة 24 ساعة، مع طاقم تمريض متخصص ومدرب على التعامل مع جميع الحالات باحترافية." />
    <meta name="keywords" content="تمريض منزلي, رعاية مسنين بالمنزل, دكتور كشف منزلي, علاج طبيعي بالمنزل, تركيب كانيولا, تعليق محاليل, تركيب قسطرة بولية, أشعة منزلية, رعاية كبار السن, المنيل, القاهرة, عبدالله سمير, رعاية صحية منزلية, جليس مسنين, home nursing, elderly care, geriatric care, home health care, Cairo, Almanial, at-home doctor visit, home physiotherapy, IV fluids at home, urinary catheter installation, home X-ray, post-surgery recovery, senior care, Abdullah Samir" />
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('theme') || 'light';
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
          
          var lang = localStorage.getItem('language') || 'en';
          document.documentElement.lang = lang;
          document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
